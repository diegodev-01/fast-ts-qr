[package]
name = "fast-ts-qr"
version = "0.1.1"
edition = "2024"
description = "Generador de códigos QR ultrarrápido con Rust + WebAssembly"
license = "MIT"
repository = "https://github.com/diegodev-01/fast-ts-qr"
keywords = ["qr", "wasm", "webassembly", "qrcode"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"   # prioriza tamaño del .wasm
lto = true

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
fast_qr = { version = "0.12", features = ["wasm-bindgen"] }