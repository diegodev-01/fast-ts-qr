[package]
name = "fast-ts-qr"
version = "0.1.2"
edition = "2024"
description = "Generador de códigos QR ultrarrápido con Rust + WebAssembly, utilizando la tecnologia de la libreria nativa de rust fast-qr"
license = "MIT"
repository = "https://github.com/diegodev-01/fast-ts-qr"
keywords = ["qr", "wasm", "webassembly", "qrcode", "ts", "web"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
fast_qr = { version = "0.12", features = ["wasm-bindgen"] }